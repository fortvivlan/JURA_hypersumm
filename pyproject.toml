[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "jura-hypersumm"
version = "0.1.0"
description = "Utilities and experiments for contradiction detection in Russian legal texts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "python-docx>=1.1,<2",
    "razdel>=0.5,<1",
    "scikit-learn>=1.4,<2",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
colab = [
    "accelerate>=1.2,<2",
    "bitsandbytes>=0.45,<1",
    "datasets>=3.2,<5",
    "faiss-cpu>=1.9,<2",
    "langchain-community>=0.3,<1",
    "langchain-huggingface>=0.1,<2",
    "langchain-text-splitters>=0.3,<2",
    "peft>=0.13,<1",
    "sentence-transformers>=3.3,<6",
    "torch>=2.4,<3",
    "transformers>=4.51,<5",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
py-modules = [
    "convert_datasets",
    "prompt",
    "prompt_binary",
    "run_lora_alpha_local",
    "run_lora_dropout_local",
    "run_lora_lr_experiments_local",
    "run_lora_rank_local",
    "run_lora_target_modules_local",
    "run_lora_vs_llm_comparison_local",
    "run_citation_audit_local",
    "run_rag_depth_sweep_local",
    "run_rag_embedding_sweep_local",
    "run_rag_experiment_local",
    "run_full_pipeline_evaluation_local",
]

[tool.setuptools.packages.find]
include = ["jura_hypersumm*"]
